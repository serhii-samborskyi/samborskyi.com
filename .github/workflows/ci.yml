name: Validate app and Docker deployment
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: studio_test
          POSTGRES_PASSWORD: ci-disposable-database
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio_test -d studio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://studio_test:ci-disposable-database@127.0.0.1:5432/studio_test
      - name: Build Docker image without runtime secrets
        run: docker build -t samborskyi-ci .
      - name: Start the app with two runtime variables and Coolify domain metadata
        run: |
          docker run -d --name studio-ci --network host \
            -e DATABASE_URL=postgresql://studio_test:ci-disposable-database@127.0.0.1:5432/studio_test \
            -e ADMIN_PASSWORD=ci-disposable-admin-password \
            -e COOLIFY_URL=http://preview.example.test:3000,https://music.example.test:3000 samborskyi-ci
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs studio-ci
          exit 1
      - name: Verify HTTP publishing workflow
        run: node scripts/smoke.mjs
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
          SMOKE_ORIGIN: https://music.example.test
          SMOKE_ADMIN_PASSWORD: ci-disposable-admin-password
      - name: Replace the entire container
        run: |
          docker stop --time 30 studio-ci
          docker rm studio-ci
          docker run -d --name studio-ci --network host \
            -e DATABASE_URL=postgresql://studio_test:ci-disposable-database@127.0.0.1:5432/studio_test \
            -e ADMIN_PASSWORD=ci-disposable-admin-password \
            -e COOLIFY_URL=http://preview.example.test:3000,https://music.example.test:3000 samborskyi-ci
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs studio-ci
          exit 1
      - name: Verify data and authentication survive redeploy
        run: node scripts/smoke.mjs --verify
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
          SMOKE_ORIGIN: https://music.example.test
          SMOKE_ADMIN_PASSWORD: ci-disposable-admin-password
      - name: Container logs
        if: failure()
        run: docker logs studio-ci || true
